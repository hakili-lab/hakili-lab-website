# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Configuration de l'interface d'administration (Sveltia CMS), servie sur
# /admin. Elle edite directement les fichiers Markdown du depot via l'API
# GitHub : chaque enregistrement est un commit sur la branche main.
#
# Les champs ci-dessous reproduisent exactement les schemas Zod de
# src/content.config.ts. Toute divergence (nom de champ, type, valeur
# d'enumeration) produirait des entrees que `astro build` refuse.
#
# Hors perimetre de cette interface : les centres (src/data/centres.js),
# l'equipe (src/data/team.js), les tarifs et fiches detaillees
# (src/data/details.js, levels.js, site.js) restent edites dans le code.

backend:
  name: github
  repo: hakili-lab/hakili-lab-website
  branch: main
  # Le Worker porte le Client ID et le Client Secret de la GitHub OAuth App.
  # Ces deux valeurs vivent uniquement dans le Worker, jamais dans ce depot.
  base_url: https://sveltia-cms-auth.zidawendkounieddieeliel.workers.dev

site_url: https://www.hakililab.com

# Dossier ou sont deposees les images televersees depuis l'interface. Les
# photos du site sont deja toutes dans src/assets/photos/ (a plat) : on garde
# ce dossier unique plutot que d'en creer un second.
media_folder: "src/assets/photos"
public_folder: "/src/assets/photos"

output:
  # Un champ facultatif laisse vide est omis du frontmatter au lieu d'y ecrire
  # une valeur vide. Indispensable pour `image` : `image: ""` ferait echouer le
  # build (Astro tente de resoudre la chaine vide comme un fichier image),
  # alors que l'absence du champ est valide (image().optional()).
  omit_empty_optional_fields: true

collections:
  # --- Articles de blog -----------------------------------------------------
  # Schema : src/content.config.ts > const blog
  - name: "blog"
    label: "Articles de blog"
    label_singular: "Article"
    description: "Les articles publies sur /blog."
    folder: "src/content/blog"
    create: true
    # Le nom du fichier reprend le champ `slug` du frontmatter, qui est aussi
    # ce qui construit l'URL (voir getStaticPaths de src/pages/blog/[slug].astro).
    slug: "{{fields.slug}}"
    identifier_field: "titre"
    summary: "{{fields.titre}}"
    sortable_fields: ["date", "titre", "categorie"]
    # Chemin depuis le fichier de l'article jusqu'au dossier des photos :
    # src/content/blog/x.md -> ../../assets/photos/. C'est la forme deja
    # utilisee par les articles existants, et celle qu'Astro sait resoudre.
    media_folder: "/src/assets/photos"
    public_folder: "../../assets/photos"
    fields:
      - name: "slug"
        label: "Adresse de la page (slug)"
        widget: "string"
        required: true
        hint: "En minuscules, sans accents ni espaces (tirets a la place). Donne l'URL : /blog/mon-article. Ne plus le changer une fois l'article en ligne."
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Uniquement des minuscules, des chiffres et des tirets."]
      - name: "titre"
        label: "Titre"
        widget: "string"
        required: true
      - name: "description"
        label: "Description"
        widget: "text"
        required: true
        hint: "La phrase affichee sous le titre sur la carte de l'article et dans les resultats de recherche."
      - name: "date"
        label: "Date de publication"
        widget: "datetime"
        required: true
        type: "date"
        format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - name: "categorie"
        label: "Categorie"
        widget: "select"
        required: true
        options: ["Pédagogie", "Conseils", "Actualité"]
      - name: "image"
        label: "Image"
        widget: "image"
        required: false
        choose_url: false
        hint: "Facultatif. Sans image, l'article s'affiche simplement sans illustration."
      - name: "brouillon"
        label: "Brouillon (non publie)"
        widget: "boolean"
        # Volontairement true : un nouvel article ne doit jamais se publier par
        # accident avant relecture. Le schema Zod, lui, vaut false par defaut
        # pour les articles deja en ligne.
        default: true
        hint: "Tant que cette case est cochee, l'article n'apparait ni sur /blog ni a son adresse."
      - name: "body"
        label: "Texte de l'article"
        widget: "markdown"
        required: true

  # --- Services -------------------------------------------------------------
  # Schema : src/content.config.ts > const services
  - name: "services"
    label: "Services"
    label_singular: "Service"
    description: "Les fiches de /services. Tous les champs ont une valeur par defaut : une fiche peut rester incomplete tant que « Pret pour publication » est decoche."
    folder: "src/content/services"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: "nom"
    summary: "{{fields.nom}}"
    sortable_fields: ["nom", "slug"]
    fields:
      - name: "slug"
        label: "Adresse de la page (slug)"
        widget: "string"
        required: true
        hint: "En minuscules, sans accents ni espaces. Donne l'URL : /services/cours-appui."
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Uniquement des minuscules, des chiffres et des tirets."]
      - name: "nom"
        label: "Nom du service"
        widget: "string"
        required: false
      - name: "resumeCourt"
        label: "Resume court"
        widget: "text"
        required: false
      - name: "publicVise"
        label: "Public vise"
        widget: "list"
        required: false
        label_singular: "Profil"
        field: { name: "profil", label: "Profil", widget: "string" }
      - name: "deroule"
        label: "Deroule"
        widget: "list"
        required: false
        label_singular: "Etape"
        field: { name: "etape", label: "Etape", widget: "string" }
      - name: "facts"
        label: "Informations pratiques"
        widget: "list"
        required: false
        label_singular: "Information"
        summary: "{{fields.label}} : {{fields.valeur}}"
        fields:
          - { name: "label", label: "Libelle", widget: "string", required: true }
          - { name: "valeur", label: "Valeur", widget: "string", required: true }
      - name: "cta"
        label: "Texte du bouton (appel a l'action)"
        widget: "string"
        required: false
      - name: "pretPourPublication"
        label: "Pret pour publication"
        widget: "boolean"
        default: false
        hint: "A ne cocher que lorsque slug, nom, resume court, public vise, deroule et texte du bouton contiennent de vraies valeurs. Une formule d'attente (« A definir », « A preciser »…) dans l'un de ces champs fait echouer la mise en ligne."
      - name: "body"
        label: "Texte de la fiche"
        widget: "markdown"
        required: false

  # --- Manuels --------------------------------------------------------------
  # Schema : src/content.config.ts > const manuels
  - name: "manuels"
    label: "Manuels"
    label_singular: "Manuel"
    description: "Les fiches de /manuels. Tous les champs ont une valeur par defaut : une fiche peut rester incomplete tant que « Pret pour publication » est decoche."
    folder: "src/content/manuels"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: "slug"
    summary: "{{fields.niveau}} — {{fields.matiere}}"
    sortable_fields: ["slug", "niveau", "matiere"]
    fields:
      - name: "slug"
        label: "Adresse de la page (slug)"
        widget: "string"
        required: true
        hint: "En minuscules, sans accents ni espaces. Donne l'URL : /manuels/mathematiques-3e."
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Uniquement des minuscules, des chiffres et des tirets."]
      - name: "niveau"
        label: "Niveau"
        widget: "string"
        required: false
        hint: "Tel qu'affiche sur la fiche, par exemple 3ᵉ, 2ⁿᵈᵉ, Terminale."
      - name: "matiere"
        label: "Matiere"
        widget: "string"
        required: false
      - name: "resumeCourt"
        label: "Resume court"
        widget: "text"
        required: false
      - name: "publicVise"
        label: "Public vise"
        widget: "list"
        required: false
        label_singular: "Profil"
        field: { name: "profil", label: "Profil", widget: "string" }
      - name: "caracteristiques"
        label: "Caracteristiques"
        widget: "list"
        required: false
        label_singular: "Caracteristique"
        field: { name: "caracteristique", label: "Caracteristique", widget: "string" }
      - name: "facts"
        label: "Informations pratiques"
        widget: "list"
        required: false
        label_singular: "Information"
        summary: "{{fields.label}} : {{fields.valeur}}"
        fields:
          - { name: "label", label: "Libelle", widget: "string", required: true }
          - { name: "valeur", label: "Valeur", widget: "string", required: true }
      - name: "cta"
        label: "Texte du bouton (appel a l'action)"
        widget: "string"
        required: false
      - name: "pretPourPublication"
        label: "Pret pour publication"
        widget: "boolean"
        default: false
        hint: "A ne cocher que lorsque slug, niveau, matiere, resume court et texte du bouton contiennent de vraies valeurs. Une formule d'attente (« A definir », « A preciser »…) dans l'un de ces champs fait echouer la mise en ligne."
      - name: "body"
        label: "Texte de la fiche"
        widget: "markdown"
        required: false
  # --- Nos centres ----------------------------------------------------------
  # Schema : src/data/centres.js > centreSchema
  #
  # Collection de type "files" et non "folder" : les 5 centres forment un
  # ensemble fixe, ecrit dans un seul fichier de donnees (src/data/centres.json),
  # pas une liste ouverte ou l on cree et supprime des entrees librement.
  - name: "centres"
    label: "Nos centres"
    files:
      - name: "centres"
        label: "Les 5 centres"
        file: "src/data/centres.json"
        description: "Les centres affiches sur /centres et sur l'accueil. Le fichier contient les cinq centres a la fois : enregistrer met a jour la page de chacun."
        fields:
          - name: "centres"
            label: "Centres"
            label_singular: "Centre"
            widget: "list"
            summary: "{{fields.nom}}"
            fields:
              - name: "slug"
                label: "Identifiant (slug)"
                widget: "string"
                required: true
                hint: "En minuscules, sans accents ni espaces. Donne l'URL : /centres/pissy. Ne plus le changer une fois le centre en ligne."
                pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Uniquement des minuscules, des chiffres et des tirets."]
              - name: "nom"
                label: "Nom"
                widget: "string"
                required: false
              - name: "description"
                label: "Description"
                widget: "text"
                required: false
                hint: "La phrase affichee sous le nom du centre, sur la carte et en haut de sa page."
              - name: "image"
                label: "Photo"
                widget: "image"
                required: true
                choose_url: false
                hint: "La photo doit etre choisie ou televersee dans src/assets/photos/. Une adresse externe ne fonctionnerait pas : le site retaille les images au moment de la compilation."
              - name: "horaires"
                label: "Horaires"
                widget: "object"
                fields:
                  - name: "resume"
                    label: "Resume"
                    widget: "string"
                    required: false
                    hint: "Le texte affiche tant que la grille detaillee est vide, par exemple « Du lundi au samedi, 8h a 18h »."
                  - name: "grille"
                    label: "Grille detaillee"
                    label_singular: "Journee"
                    widget: "list"
                    required: false
                    summary: "{{fields.jour}}"
                    hint: "Facultatif. Des qu'une journee est ajoutee ici, la grille remplace le resume ci-dessus."
                    fields:
                      - name: "jour"
                        label: "Jour"
                        widget: "string"
                        required: true
                      - name: "creneaux"
                        label: "Creneaux"
                        label_singular: "Creneau"
                        widget: "list"
                        summary: "{{fields.debut}} - {{fields.fin}} : {{fields.niveau}}"
                        fields:
                          - { name: "debut", label: "Debut", widget: "string", required: true }
                          - { name: "fin", label: "Fin", widget: "string", required: true }
                          - { name: "niveau", label: "Niveau", widget: "string", required: true }
              - name: "classesOuvertes"
                label: "Classes ouvertes"
                widget: "string"
                required: false
              - name: "adresse"
                label: "Adresse"
                widget: "string"
                required: false
              - name: "latitude"
                label: "Latitude"
                widget: "number"
                required: false
                value_type: "float"
                hint: "Facultatif. Latitude et longitude vont ensemble : renseignez les deux ou aucune."
              - name: "longitude"
                label: "Longitude"
                widget: "number"
                required: false
                value_type: "float"
              - name: "googleMapsUrl"
                label: "Lien Google Maps"
                widget: "string"
                required: false
              - name: "pretPourPublication"
                label: "Pret pour publication"
                widget: "boolean"
                default: false
                hint: "A ne cocher que lorsque le nom, la description et le resume des horaires contiennent de vraies valeurs. Une formule d'attente (« A definir », « A preciser »…) dans l'un de ces champs fait echouer la mise en ligne."
  # --- Equipe ---------------------------------------------------------------
  # Schema : src/data/team.js > personSchema
  #
  # Collection de type "files" comme les centres : deux listes connues
  # (fondateurs, enseignants) dans un seul fichier de donnees, pas une
  # arborescence d'entrees a creer et supprimer librement.
  #
  # Note : la section « L'equipe » de /enseignants est commentee pour le
  # moment, en attendant de vraies photos (voir docs/EQUIPE.md). Les fiches
  # restent editables ici ; elles s'afficheront le jour ou la section sera
  # reactivee. « Nos fondateurs », sur /a-propos, est bien affichee.
  - name: "equipe"
    label: "Equipe"
    files:
      - name: "equipe"
        label: "Fondateurs et enseignants"
        file: "src/data/team.json"
        description: "Les portraits nommes : les fondateurs affiches sur /a-propos, et les enseignants de la page /enseignants."
        fields:
          - name: "fondateurs"
            label: "Fondateurs"
            label_singular: "Fondateur"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - name: "name"
                label: "Nom"
                widget: "string"
                required: true
              - name: "role"
                label: "Role"
                widget: "string"
                required: true
                hint: "Affiche sous le nom, par exemple « Co-fondateur » ou « Enseignant de mathematiques »."
              - name: "bio"
                label: "Biographie"
                widget: "text"
                required: true
                hint: "Un paragraphe. Obligatoire : une carte sans biographie afficherait un blanc sous le nom. Tant que le vrai texte n'est pas pret, laissez « Biographie a venir. »."
              - name: "photo"
                label: "Photo"
                widget: "image"
                required: false
                choose_url: false
                hint: "Facultatif. Sans photo, la carte affiche automatiquement les initiales de la personne sur un fond bleu tres clair. La photo doit etre choisie ou televersee dans src/assets/photos/ : une adresse externe ne fonctionnerait pas, le site retaille les images au moment de la compilation."
          - name: "enseignants"
            label: "Enseignants"
            label_singular: "Enseignant"
            widget: "list"
            required: false
            summary: "{{fields.name}}"
            fields:
              - name: "name"
                label: "Nom"
                widget: "string"
                required: true
              - name: "role"
                label: "Role"
                widget: "string"
                required: true
                hint: "Affiche sous le nom, par exemple « Co-fondateur » ou « Enseignant de mathematiques »."
              - name: "bio"
                label: "Biographie"
                widget: "text"
                required: true
                hint: "Un paragraphe. Obligatoire : une carte sans biographie afficherait un blanc sous le nom. Tant que le vrai texte n'est pas pret, laissez « Biographie a venir. »."
              - name: "photo"
                label: "Photo"
                widget: "image"
                required: false
                choose_url: false
                hint: "Facultatif. Sans photo, la carte affiche automatiquement les initiales de la personne sur un fond bleu tres clair. La photo doit etre choisie ou televersee dans src/assets/photos/ : une adresse externe ne fonctionnerait pas, le site retaille les images au moment de la compilation."
  # --- Coordonnees et bandeau -----------------------------------------------
  # Schema : src/data/site.js > parametresSchema
  #
  # Ne sont volontairement PAS editables ici : SITE_URL, SITE_TITLE et
  # SITE_DESCRIPTION. Ces trois valeurs pilotent le build et le referencement
  # (URL canoniques, sitemap, robots.txt, titre et description par defaut) et
  # non une information de contact : une faute de frappe enregistree depuis
  # cette interface les casserait toutes d'un coup, sans rien pour le
  # signaler. Elles restent ecrites en dur dans src/data/site.js.
  - name: "parametres"
    label: "Coordonnees et bandeau"
    files:
      - name: "parametres"
        label: "Coordonnees, reseaux sociaux et bandeau"
        file: "src/data/parametres-site.json"
        description: "Les coordonnees affichees partout sur le site (bandeau du haut, pied de page, page Contact, balisage pour les moteurs de recherche) et le texte du bandeau d'annonce. Une seule saisie ici met a jour toutes les pages."
        fields:
          - name: "telephones"
            label: "Telephones"
            label_singular: "Telephone"
            widget: "list"
            summary: "{{fields.display}}"
            hint: "Le premier numero de la liste est celui sur lequel pointe le lien du bandeau du haut."
            fields:
              - name: "tel"
                label: "Numero pour les liens d'appel"
                widget: "string"
                required: true
                pattern: ["^[+][0-9]{8,15}$", "Un plus suivi uniquement de chiffres, indicatif compris : +22657919191"]
                hint: "Format international, sans espace : +22657919191. C'est ce numero qui est compose quand on touche le lien."
              - name: "display"
                label: "Numero tel qu'affiche"
                widget: "string"
                required: true
                hint: "La forme lisible, sans l'indicatif : 57 91 91 91."
          - name: "email"
            label: "Adresse e-mail"
            widget: "string"
            required: true
            pattern: ["^[^@ ]+@[^@ ]+[.][^@ ]+$", "Une adresse e-mail valide est attendue."]
          - name: "whatsapp"
            label: "Numero WhatsApp"
            widget: "string"
            required: true
            pattern: ["^[0-9]{10,15}$", "Uniquement des chiffres, indicatif pays compris et sans le plus : 22657919191. Ni espaces, ni tirets, ni +."]
            hint: "Ce numero alimente tous les boutons WhatsApp du site. Il s'ecrit sans le plus et sans espaces, indicatif pays compris : 22657919191. Un espace oublie rendrait chaque bouton inoperant."
          - name: "reseauxSociaux"
            label: "Reseaux sociaux"
            label_singular: "Reseau"
            widget: "list"
            required: false
            summary: "{{fields.plateforme}}"
            hint: "Affiches en bas de page, et declares aux moteurs de recherche comme profils officiels."
            fields:
              - name: "plateforme"
                label: "Nom du reseau"
                widget: "string"
                required: true
                hint: "Le texte du lien, par exemple Facebook ou TikTok."
              - name: "url"
                label: "Adresse du profil"
                widget: "string"
                required: true
                pattern: ["^https?://.+", "Une adresse complete est attendue, https:// compris."]
          - name: "bandeau"
            label: "Bandeau d'annonce"
            widget: "object"
            hint: "Le bandeau fin tout en haut de chaque page."
            fields:
              - name: "badge"
                label: "Pastille"
                widget: "string"
                required: false
                hint: "Le texte court sur fond vert, affiche en majuscules quel que soit ce qui est saisi ici. Exemple : Rentree 2026-2027."
              - name: "texte"
                label: "Phrase d'annonce"
                widget: "string"
                required: false
                hint: "La phrase a cote de la pastille. Masquee sur petits ecrans."
  # --- Fiches « En savoir plus » --------------------------------------------
  # Schema : src/content.config.ts > ficheDetailSchema
  #
  # Huit fiches, dans un seul fichier de donnees. Cinq s'ouvrent en fenetre
  # modale depuis les cartes de /services ; les trois autres sont lues
  # directement par une page dediee : "test de positionnement" par /methode,
  # "amira" par /amira, "maya" par /maya.
  - name: "fiches"
    label: "Fiches « En savoir plus »"
    files:
      - name: "fiches"
        label: "Les 8 fiches"
        file: "src/data/details.json"
        description: "Le contenu des fenetres « En savoir plus » ouvertes depuis les cartes de la page Services, et des encarts des pages Notre methode, Amira et Maya."
        fields:
          - name: "fiches"
            label: "Fiches"
            label_singular: "Fiche"
            widget: "list"
            summary: "{{fields.cle}}"
            fields:
              - name: "cle"
                label: "Cle de liaison (a ne pas modifier a la legere)"
                widget: "string"
                required: true
                pattern: ["^[a-z0-9]+( [a-z0-9]+)*$", "Uniquement des minuscules, des chiffres et des espaces simples : ni majuscule, ni accent, ni ponctuation. Un accent ou une majuscule empecherait la fiche de s'ouvrir."]
                hint: "AVERTISSEMENT : cette cle n'est pas un identifiant libre. Pour les cinq fiches ouvertes depuis la page Services, elle doit correspondre EXACTEMENT au titre affiche sur la carte, ecrit sans accents, sans majuscules et sans ponctuation (« Mathematiques au secondaire » sur la carte donne « mathematiques au secondaire » ici). Si les deux ne correspondent plus, le bouton « En savoir plus » de cette carte cesse d'ouvrir la fiche, sans aucun message d'erreur ni echec de compilation. Modifier une cle impose donc de modifier le titre de la carte dans le meme mouvement, et inversement. Les trois fiches « test de positionnement », « amira » et « maya » echappent a cette regle : elles sont appelees par leur cle depuis les pages Notre methode, Amira et Maya, mais renommer leur cle casserait ces pages au build."
              - name: "k"
                label: "Categorie"
                widget: "string"
                required: true
                hint: "Le petit intitule vert au-dessus du titre : Matiere, Formule ou Application."
              - name: "p"
                label: "Presentation"
                widget: "text"
                required: true
                hint: "Le paragraphe d'introduction de la fiche."
              - name: "who"
                label: "Pour qui"
                label_singular: "Profil"
                widget: "list"
                field: { name: "profil", label: "Profil", widget: "string" }
                hint: "Au moins un profil."
              - name: "how"
                label: "Comment cela se passe"
                label_singular: "Etape"
                widget: "list"
                field: { name: "etape", label: "Etape", widget: "string" }
                hint: "Au moins une etape."
              - name: "facts"
                label: "Informations pratiques"
                label_singular: "Information"
                widget: "list"
                required: false
                summary: "{{fields.label}} : {{fields.valeur}}"
                hint: "Les pastilles en bas de fiche. Une information dont la valeur est une formule d'attente (« A definir », « A preciser ») n'est pas affichee."
                fields:
                  - { name: "label", label: "Libelle", widget: "string", required: true }
                  - { name: "valeur", label: "Valeur", widget: "string", required: true }
              - name: "cta"
                label: "Texte du bouton (appel a l'action)"
                widget: "string"
                required: true
  # --- Contenu du site ------------------------------------------------------
  # Schemas : src/data/hero.js, src/data/valeurs.js, src/data/faq.js
  #
  # Une seule collection pour les trois blocs de texte de marque, regroupes ici
  # plutot qu'eparpilles en trois collections de premier niveau : ce sont tous
  # des textes de page, pas des donnees structurees comme les centres ou les
  # manuels.
  - name: "contenu"
    label: "Contenu du site"
    files:
      # --- Accueil (Hero.astro) ---
      - name: "accueil"
        label: "Accueil : bandeau principal"
        file: "src/data/hero.json"
        description: "Le grand bandeau en haut de la page d'accueil : titre, phrase d'introduction, ligne de reperes et les deux boutons. Les photos qui defilent derriere ne se changent pas ici."
        fields:
          - name: "titre"
            label: "Titre"
            widget: "object"
            hint: "Le titre est en trois morceaux pour que le mot mis en vert reste au bon endroit sans avoir a ecrire de code."
            fields:
              - name: "avant"
                label: "Debut du titre"
                widget: "string"
                required: false
                hint: "Ce qui precede le mot en vert. Pensez a l'espace final : « Votre enfant peut »."
              - name: "accent"
                label: "Mot mis en vert"
                widget: "string"
                required: true
                hint: "Le seul mot (ou groupe de mots) affiche en vert dans le titre."
              - name: "apres"
                label: "Fin du titre"
                widget: "string"
                required: false
                hint: "Ce qui suit le mot en vert. Pensez a l'espace initial : « comprendre les maths. »."
          - name: "sousTitre"
            label: "Phrase d'introduction"
            widget: "text"
            required: true
          - name: "meta"
            label: "Ligne de reperes"
            label_singular: "Repere"
            widget: "list"
            field: { name: "repere", label: "Repere", widget: "string" }
            hint: "Affiches sous les boutons, separes par des points : Ouagadougou, Cinq centres, Depuis 2020."
          - name: "boutons"
            label: "Boutons"
            label_singular: "Bouton"
            widget: "list"
            summary: "{{fields.texte}}"
            min: 2
            max: 2
            hint: "Exactement deux boutons. Le premier est le bouton vert plein, le second le bouton contour : cet ordre determine leur apparence."
            fields:
              - { name: "texte", label: "Texte du bouton", widget: "string", required: true }
              - name: "lien"
                label: "Lien"
                widget: "string"
                required: true
                hint: "Une adresse du site (/methode) ou une adresse complete (https://...). Une adresse complete s'ouvre automatiquement dans un nouvel onglet."

      # --- Page /valeurs ---
      - name: "valeurs"
        label: "Nos valeurs et engagements"
        file: "src/data/valeurs.json"
        description: "Les deux sections de la page Nos valeurs : la liste a coches, et les quatre cartes d'engagements des eleves."
        fields:
          - name: "valeurs"
            label: "Section « Nos valeurs »"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Petit intitule vert", widget: "string", required: true }
              - { name: "titre", label: "Titre", widget: "string", required: true }
              - name: "items"
                label: "Valeurs"
                label_singular: "Valeur"
                widget: "list"
                field:
                  name: "valeur"
                  label: "Valeur"
                  widget: "markdown"
                  modes: ["raw"]
                  buttons: ["bold"]
                  editor_components: []
                  minimal: true
                hint: "Une ligne par valeur. Pour mettre un passage en gras, entourez-le de deux etoiles : **comme ceci**."
          - name: "engagements"
            label: "Section « Engagements de nos eleves »"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Petit intitule vert", widget: "string", required: true }
              - { name: "titre", label: "Titre", widget: "string", required: true }
              - { name: "intro", label: "Phrase d'introduction", widget: "string", required: true }
              - name: "cartes"
                label: "Cartes"
                label_singular: "Carte"
                widget: "list"
                summary: "{{fields.titre}}"
                hint: "L'icone de chaque carte est fixee par le gabarit et suit le rang de la carte : reordonner les cartes reordonne aussi les icones."
                fields:
                  - { name: "titre", label: "Titre de la carte", widget: "string", required: true }
                  - name: "items"
                    label: "Engagements"
                    label_singular: "Engagement"
                    widget: "list"
                    field:
                      name: "engagement"
                      label: "Engagement"
                      widget: "markdown"
                      modes: ["raw"]
                      buttons: ["bold"]
                      editor_components: []
                      minimal: true
                    hint: "Une ligne par engagement. Le debut de phrase est habituellement en gras : **J'arrive a l'heure** pour ne manquer aucune..."

      # --- Page /faq ---
      - name: "faq"
        label: "Questions frequentes"
        file: "src/data/faq.json"
        description: "La page Foire aux questions. La premiere question est aussi celle reprise en apercu sur la page d'accueil, et l'ensemble alimente le balisage lu par les moteurs de recherche."
        fields:
          - { name: "eyebrow", label: "Petit intitule vert", widget: "string", required: true }
          - { name: "titre", label: "Titre", widget: "string", required: true }
          - { name: "intro", label: "Phrase d'introduction", widget: "string", required: true }
          - name: "questions"
            label: "Questions"
            label_singular: "Question"
            widget: "list"
            summary: "{{fields.question}}"
            hint: "La premiere de la liste est affichee depliee sur la page, et c'est elle qui apparait en apercu sur la page d'accueil."
            fields:
              - { name: "question", label: "Question", widget: "string", required: true }
              - { name: "reponse", label: "Reponse", widget: "text", required: true }
          - name: "cta"
            label: "Texte du bouton de bas de page"
            widget: "string"
            required: true
            hint: "Le bouton renvoie vers la page Contact."
