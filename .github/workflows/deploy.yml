# Deploiement automatique du site sur le VPS.
#
# Trois etapes, dans cet ordre, et chacune ne demarre que si la precedente a
# reussi (`needs`) :
#
#   1. verifier  — sur le runner GitHub : `npm ci` puis `npm run build`.
#      C'est le garde-fou qui manquait depuis qu'on n'est plus chez un
#      hebergeur statique qui refusait de publier un build en echec. Un
#      contenu invalide (voir src/content.config.ts) fait echouer cette
#      etape, et le serveur n'est jamais touche.
#
#   2. publier   — sur le runner GitHub : construction de l'image Docker a
#      partir du Dockerfile du depot, puis publication sur GitHub Container
#      Registry (ghcr.io).
#
#   3. deployer  — sur le VPS, par SSH : recuperation de l'image deja
#      construite, puis seulement ensuite le remplacement du conteneur.
#
# Pourquoi construire ici plutot que sur le VPS : le VPS est une petite
# machine partagee avec d'autres projets, et `docker build` y refaisait
# `npm ci` + `npm run build` a chaque deploiement. Un deploiement a fini par
# etre tue par le noyau, faute de memoire (code de sortie 137). L'image est
# donc construite une seule fois, sur un runner GitHub dimensionne pour ca ;
# le VPS ne fait plus que la telecharger et la lancer.
#
# Aucun secret n'est ecrit ici : uniquement des references ${{ secrets.* }}.
# La publication sur ghcr.io utilise GITHUB_TOKEN, fourni automatiquement a
# chaque execution — il n'y a aucun secret a creer pour elle.

name: Deploiement

on:
  push:
    branches: [main]

# Lecture seule par defaut : ce workflow ne pousse rien sur le depot. Seul le
# job `publier` eleve ses droits, et uniquement pour le registre d'images.
permissions:
  contents: read

# Deux pushes rapproches ne doivent pas deployer en parallele sur la meme
# machine. `cancel-in-progress: false` : on ne coupe jamais un deploiement
# deja en cours au milieu d'un docker pull/run, on attend qu'il finisse.
concurrency:
  group: deploiement-production
  cancel-in-progress: false

env:
  # Ecrit une seule fois ici : le job de publication et celui de deploiement
  # designent ainsi forcement la meme image. ghcr.io exige des minuscules,
  # ce que l'organisation et le depot respectent deja.
  IMAGE: ghcr.io/hakili-lab/hakili-lab-website

jobs:
  # --- Etape 1 : le site se construit-il ? ---------------------------------
  verifier:
    name: Verifier que le site se construit
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          # Aligne sur engines.node de package.json (">=22.12.0") et sur le
          # node:22-slim du Dockerfile : le build du runner et celui de
          # l'image tournent ainsi sur la meme version majeure.
          node-version: '22'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Construire le site
        run: npm run build

  # --- Etape 2 : construire l'image et la publier sur ghcr.io --------------
  publier:
    name: Construire et publier l'image
    runs-on: ubuntu-latest
    needs: verifier
    # Ce bloc REMPLACE les permissions declarees en tete de fichier, il faut
    # donc y redonner `contents: read` en plus de l'ecriture sur le registre.
    # Les autres jobs, eux, gardent la lecture seule.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v7

      - name: Preparer Buildx
        uses: docker/setup-buildx-action@v4

      - name: Se connecter au registre GitHub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Jeton fourni par GitHub a chaque execution, valable le temps du
          # workflow. Rien a creer ni a renouveler dans les reglages du depot.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v7
        with:
          # Le Dockerfile du depot, utilise tel quel : c'est le meme qui
          # servait a construire sur le VPS.
          context: .
          push: true
          # Deux etiquettes pour la meme image :
          #   latest — celle que le VPS utilise au quotidien ;
          #   <sha>  — l'empreinte du commit, pour pouvoir relancer une
          #            version precise a la main en cas de besoin.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # --- Etape 3 : deployer, seulement si l'image est publiee ----------------
  deployer:
    name: Deployer sur le VPS
    runs-on: ubuntu-latest
    needs: publier
    steps:
      - name: Recuperer l'image et relancer le conteneur par SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Pas d'option `fingerprint` ici : l'epinglage de cle d'hote de
          # cette action est casse et refuse la connexion meme avec une
          # empreinte correcte. Voir la note « Épinglage de la clé d'hôte »
          # de README-DEPLOIEMENT.md et l'issue appleboy/ssh-action#275.
          #
          # Le VPS ne construit plus rien : il telecharge une image deja
          # prete. Quelques minutes suffisent largement, la ou le build en
          # demandait vingt.
          command_timeout: 10m
          script: |
            set -eu

            # Le telechargement AVANT tout arret de l'existant. Le test
            # explicite ne depend pas de `set -e` : si l'image ne peut pas
            # etre recuperee, on sort ici et l'ancien conteneur continue de
            # servir le site.
            if ! docker pull ${{ env.IMAGE }}:latest; then
              echo "ERREUR : recuperation de l'image echouee. L'ancien conteneur reste en place, le site en ligne n'est pas coupe."
              echo "Si le message ci-dessus parle de 'denied' ou 'unauthorized', verifier que le paquet ghcr.io est bien public :"
              echo "  https://github.com/orgs/hakili-lab/packages -> hakili-lab-website -> Package settings -> Change visibility"
              exit 1
            fi

            # `|| true` uniquement ici : au tout premier deploiement (ou
            # apres un arret manuel) il n'y a pas de conteneur a arreter,
            # et ce n'est pas une erreur. Le garde-fou est au-dessus.
            docker stop hakili-lab-website || true
            docker rm hakili-lab-website || true

            docker run -d \
              --name hakili-lab-website \
              -p 8014:80 \
              --restart unless-stopped \
              ${{ env.IMAGE }}:latest

            # Un conteneur qui sort immediatement laisserait le site hors
            # ligne sans que le workflow s'en apercoive.
            if [ -z "$(docker ps -q --filter name=^/hakili-lab-website$)" ]; then
              echo "ERREUR : le conteneur ne tourne pas apres docker run."
              docker logs --tail 50 hakili-lab-website || true
              exit 1
            fi

            echo "Deploiement termine, conteneur en cours d'execution :"
            docker ps --filter name=^/hakili-lab-website$

            # Nettoyage en dernier, une fois le nouveau conteneur confirme en
            # service. Chaque deploiement laisse derriere lui l'image
            # precedente, devenue sans tag puisque `latest` a change de
            # cible ; sur un petit VPS elles finissent par remplir le disque.
            # Sans -a : seules les images orphelines (aucun tag, aucun
            # conteneur qui les utilise) partent — celle qui sert le site
            # n'est jamais concernee.
            #
            # `|| true` : a ce stade le deploiement a reussi et le conteneur
            # est confirme en service. Un nettoyage rate ne doit donc pas
            # faire passer le job au rouge et laisser croire que la mise en
            # ligne a echoue — contrairement au telechargement et au demarrage
            # du conteneur, qui eux sont bloquants.
            echo "Nettoyage des images Docker orphelines :"
            docker image prune -f || true
